name: Discover public MMA contract intelligence

on:
  schedule:
    - cron: '35 11 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/0037_contract_representation_intelligence.sql'
      - 'scripts/discover-contract-intel.mjs'
      - 'scripts/lib/contract-intel-discovery.mjs'
      - '.github/workflows/contract-intel-discovery.yml'

concurrency:
  group: cagemetrix-production
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify contract intelligence schema
        run: npx wrangler d1 execute cagemetrix --remote --command "SELECT 1 FROM contract_intel_candidates LIMIT 1;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Discover source-backed contract leads
        run: node scripts/discover-contract-intel.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-intel-discovery
          path: .cache/contract-intel/
          if-no-files-found: ignore
          retention-days: 14
