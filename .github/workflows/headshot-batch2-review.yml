name: Review headshot batch 2
on:
  push:
    branches:
      - feature/headshot-sweep-2
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install review dependency
        run: python -m pip install --quiet pillow
      - name: Build candidate contact sheet
        shell: bash
        run: |
          mkdir -p diagnostics/headshot-batch2/images
          python - <<'PY'
          import os, urllib.parse, urllib.request
          from PIL import Image, ImageDraw, ImageOps
          items = {
            'islam-makhachev': 'Islam Makhachev and Sergey Melikov 2025 (cropped).jpg',
            'ilia-topuria': 'Ilia Topuria at the Orbeliani Palace (cropped).jpg',
            'sean-omalley': "Sean O'Malley in 2024.jpg",
            'valentina-shevchenko': 'Valentina Shevchenko.jpg',
            'shavkat-rakhmonov': 'Shavkat Rakhmonov (cropped).jpg',
            'brandon-moreno': 'Brandon Moreno February 2021 (cropped).jpg',
            'charles-oliveira': 'Charles do Bronxs (cropped).jpg',
            'dricus-du-plessis': 'IMG-Dricus-Duplessis(cropped).jpg',
            'nassourdine-imavov': 'Nassourdine Imavov.jpg',
            'justin-gaethje': 'Justin Gaethje at press conference.png',
            'jiri-prochazka': 'JiriProchazka2022.png',
            'umar-nurmagomedov': 'UmarNurmagomedov.png',
            'robert-whittaker': 'Robert Whittaker 2024.png',
            'belal-muhammad': 'Belal Muhammad UFC (cropped).jpg',
            'max-holloway': 'Max Holloway, 2018.jpg',
            'khamzat-chimaev': 'Khamzat Chimaev 2022 (cropped).png',
          }
          tiles=[]
          for slug, filename in items.items():
            url='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+urllib.parse.quote(filename, safe="(),'_")+'?width=720'
            path=f'diagnostics/headshot-batch2/images/{slug}.jpg'
            try:
              req=urllib.request.Request(url, headers={'User-Agent':'CageMetrix/1.0 photo review'})
              data=urllib.request.urlopen(req, timeout=30).read()
              open(path,'wb').write(data)
              im=Image.open(path).convert('RGB')
              im=ImageOps.fit(im,(300,360),method=Image.Resampling.LANCZOS,centering=(0.5,0.35))
              canvas=Image.new('RGB',(320,410),'white')
              canvas.paste(im,(10,10))
              d=ImageDraw.Draw(canvas)
              d.text((10,378),slug,fill='black')
              tiles.append(canvas)
            except Exception as e:
              canvas=Image.new('RGB',(320,410),'white')
              d=ImageDraw.Draw(canvas)
              d.text((10,20),slug,fill='black')
              d.text((10,50),f'FAILED: {e}'[:48],fill='black')
              tiles.append(canvas)
          cols=4
          rows=(len(tiles)+cols-1)//cols
          sheet=Image.new('RGB',(cols*320,rows*410),(230,230,230))
          for i,t in enumerate(tiles): sheet.paste(t,((i%cols)*320,(i//cols)*410))
          sheet.save('diagnostics/headshot-batch2/contact-sheet.jpg',quality=88)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: headshot-batch2-review
          path: diagnostics/headshot-batch2/
          retention-days: 7
