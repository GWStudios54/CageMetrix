name: Verify UFC Paris fighter media
on:
  push:
    branches:
      - media/ufc-paris-photos
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify production fighter slugs and image URLs
        shell: bash
        run: |
          set -euo pipefail
          base='https://cagemetrix.aarin54.workers.dev'
          for pair in \
            'Dan Hooker|dan-hooker' \
            'Salahdine Parnasse|salahdine-parnasse' \
            'Michael Page|michael-page' \
            'Nursulton Ruziboev|nursulton-ruziboev' \
            'Daniil Donchenko|daniil-donchenko'; do
            name="${pair%%|*}"; slug="${pair##*|}"
            body=$(curl --fail --silent --show-error --get --data-urlencode "q=$name" "$base/api/fighters")
            echo "$name -> $(echo "$body" | jq -r '.data[]? | [.name,.slug] | @tsv')"
            echo "$body" | jq -e --arg slug "$slug" '.data | any(.slug == $slug)' >/dev/null
          done
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('public/headshots.json','utf8'));
          const expected=['dan-hooker','salahdine-parnasse','michael-page','nursulton-ruziboev','daniil-donchenko'];
          for(const slug of expected){
            const item=rows[slug];
            if(!item?.url||!item?.source_url||!item?.author||!item?.license||!item?.license_url) throw new Error(`Incomplete media metadata for ${slug}`);
          }
          if(Object.keys(rows).length!==expected.length) throw new Error('Unexpected UFC Paris media count');
          NODE
          jq -r '.[].url' public/headshots.json | while IFS= read -r url; do
            headers=$(mktemp)
            curl --fail --silent --show-error --location --max-time 30 --output /dev/null --dump-header "$headers" "$url"
            type=$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' | cut -d' ' -f2-)
            echo "$url -> $type"
            echo "$type" | grep -qi '^image/'
            rm -f "$headers"
          done
