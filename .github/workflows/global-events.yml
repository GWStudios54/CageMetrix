name: Sync global MMA events

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'migrations/0027_global_event_calendar.sql'
      - 'migrations/0036_global_event_bouts.sql'
      - 'scripts/sync-global-events.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'scripts/lib/sitemap.mjs'
      - 'scripts/lib/global-event-sources.mjs'
      - 'scripts/lib/global-event-calendar.mjs'
      - 'scripts/lib/global-event-html.mjs'
      - 'scripts/lib/global-event-special.mjs'
      - 'scripts/lib/global-event-special-extended.mjs'
      - 'scripts/lib/global-event-bouts.mjs'
      - 'src/event-page.ts'
      - 'src/events.ts'
      - 'scripts/data/scout-promotions.json'
      - 'tests/global-events.test.mjs'
      - 'tests/global-event-html.test.mjs'
      - 'tests/global-event-special.test.mjs'
      - 'tests/global-event-quality.test.mjs'
      - 'tests/global-event-sync.test.mjs'
      - 'tests/global-event-bouts.test.mjs'
      - 'tests/sitemap.test.mjs'
      - '.github/workflows/global-events.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/0027_global_event_calendar.sql'
      - 'migrations/0036_global_event_bouts.sql'
      - 'scripts/sync-global-events.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'scripts/lib/sitemap.mjs'
      - 'scripts/lib/global-event-sources.mjs'
      - 'scripts/lib/global-event-calendar.mjs'
      - 'scripts/lib/global-event-html.mjs'
      - 'scripts/lib/global-event-special.mjs'
      - 'scripts/lib/global-event-special-extended.mjs'
      - 'scripts/lib/global-event-bouts.mjs'
      - 'src/event-page.ts'
      - 'src/events.ts'
      - 'scripts/data/scout-promotions.json'
      - 'tests/global-events.test.mjs'
      - 'tests/global-event-html.test.mjs'
      - 'tests/global-event-special.test.mjs'
      - 'tests/global-event-quality.test.mjs'
      - 'tests/global-event-sync.test.mjs'
      - 'tests/global-event-bouts.test.mjs'
      - 'tests/sitemap.test.mjs'
      - '.github/workflows/global-events.yml'

concurrency:
  group: cagemetrix-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate event source parsers, cards, reconciliation and sitemap
        run: node --test tests/global-events.test.mjs tests/global-event-html.test.mjs tests/global-event-special.test.mjs tests/global-event-quality.test.mjs tests/global-event-sync.test.mjs tests/global-event-bouts.test.mjs tests/sitemap.test.mjs
      - name: Probe official calendars without D1 writes
        if: github.event_name == 'pull_request'
        run: node scripts/sync-global-events.mjs --dry-run
      - name: Apply event calendar schema
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync official promotion calendars and fight cards
        if: github.event_name != 'pull_request'
        run: npm run events:sync-global
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Regenerate sitemap from synchronized D1 data
        if: github.event_name != 'pull_request'
        run: node scripts/generate-sitemap.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish refreshed sitemap
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-event-audit
          path: .cache/global-events/
          if-no-files-found: ignore
          retention-days: 14
