name: Diagnose CageMetrix production endpoints

on:
  push:
    branches:
      - main
      - diagnostic/profile-history-live
    paths:
      - '.github/workflows/post-deploy-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Worker and custom domain
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          for base in https://cagemetrix.aarin54.workers.dev https://cagemetrix.com; do
            key=$(echo "$base" | sed 's#https://##;s#[^A-Za-z0-9]#_#g')
            for path in /api/health '/api/rankings?limit=1' /api/forecasts; do
              name=$(echo "$path" | sed 's#[/?=&]#_#g')
              code=$(curl --silent --show-error --location --user-agent 'Mozilla/5.0 CageMetrix-Production-Smoke/1.0' --output "diagnostics/${key}${name}.body" --dump-header "diagnostics/${key}${name}.headers" --write-out '%{http_code}' "${base}${path}" || true)
              echo "$base$path -> $code"
              head -c 300 "diagnostics/${key}${name}.body" || true
              echo
            done
          done

      - name: Verify provisional pre-UFC history behavior
        shell: bash
        run: |
          set -euo pipefail
          base='https://cagemetrix.aarin54.workers.dev'
          search=$(curl --fail --silent --show-error "$base/api/fighters?q=Parnasse")
          slug=$(node -e "const p=JSON.parse(process.argv[1]);const r=(p.data||[]).find(x=>String(x.name||'').toLowerCase().includes('parnasse'));if(!r?.slug)process.exit(2);process.stdout.write(r.slug)" "$search")
          echo "Parnasse slug: $slug"
          curl --fail --silent --show-error "$base/api/fighters/$slug" > diagnostics/parnasse-profile.json
          curl --fail --silent --show-error "$base/api/fighters/arman-tsarukyan" > diagnostics/established-profile.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('diagnostics/parnasse-profile.json','utf8'));
          const e=JSON.parse(fs.readFileSync('diagnostics/established-profile.json','utf8'));
          const pre=p.pre_ufc_bouts||[];
          const orgs=[...new Set(pre.map(x=>x.organization).filter(Boolean))];
          const result={
            parnasse:{name:p.fighter?.name,slug:p.fighter?.slug,ufc_bouts:p.fighter?.ufc_bouts,provisional:p.rating?.provisional,show_pre_ufc_history:p.show_pre_ufc_history,history_scope:p.history_scope,pre_ufc_bouts:pre.length,organizations:orgs,sample:pre.slice(0,3).map(x=>({date:x.event_date,org:x.organization,result:x.result,opponent:x.opponent_name,method:x.method_normalized||x.method_raw}))},
            established:{name:e.fighter?.name,ufc_bouts:e.fighter?.ufc_bouts,provisional:e.rating?.provisional,show_pre_ufc_history:e.show_pre_ufc_history,history_scope:e.history_scope,pre_ufc_bouts:(e.pre_ufc_bouts||[]).length}
          };
          console.log(JSON.stringify(result,null,2));
          fs.writeFileSync('diagnostics/profile-history-summary.json',JSON.stringify(result,null,2));
          if(!String(p.fighter?.name||'').toLowerCase().includes('parnasse')) throw new Error('Unexpected Parnasse identity: '+p.fighter?.name);
          if(!p.show_pre_ufc_history||p.history_scope!=='combined'||pre.length<1) throw new Error('Parnasse pre-UFC history is not live');
          if(!orgs.some(x=>String(x).toUpperCase().includes('KSW'))) throw new Error('Parnasse live history does not contain KSW');
          if(e.show_pre_ufc_history||e.history_scope!=='ufc'||(e.pre_ufc_bouts||[]).length!==0) throw new Error('Established fighter did not return to UFC-focused history');
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-diagnostics
          path: diagnostics/
          retention-days: 7
