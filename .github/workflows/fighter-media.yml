name: Refresh fighter media

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
  workflow_run:
    workflows:
      - Deploy CageMetrix
    types:
      - completed

concurrency:
  group: cagemetrix-fighter-media
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Resolve licensed fighter photos
        run: npm run photos:refresh -- --remote --max=1200
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Detect catalog changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public/headshots-auto.json scripts/data/fighter-media-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed catalog
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "cagemetrix-media-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/headshots-auto.json scripts/data/fighter-media-state.json
          git commit -m "chore: refresh licensed fighter photos [skip media refresh]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy refreshed media
        if: steps.changes.outputs.changed == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
