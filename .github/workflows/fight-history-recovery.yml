name: Recover global fight histories

on:
  workflow_run:
    workflows:
      - Sync MMA master database
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'migrations/0032_participant_identity_resolutions.sql'
      - 'migrations/0033_participant_identity_seed_facts.sql'
      - 'migrations/0034_source_name_history_coverage.sql'
      - 'migrations/0035_source_master_name_identities.sql'
      - 'scripts/resolve-participant-identities.mjs'
      - 'scripts/derive-source-name-history-identities.mjs'
      - 'scripts/recover-global-fight-history.mjs'
      - 'scripts/backfill-history-opponent-identities.mjs'
      - 'scripts/audit-fighter-history-coverage.mjs'
      - 'tests/participant-identity-recovery.test.mjs'
      - 'tests/fight-history-recovery.test.mjs'
      - 'tests/full-history-coverage.test.mjs'
      - '.github/workflows/fight-history-recovery.yml'
  workflow_dispatch:

concurrency:
  group: cagemetrix-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate identity and history recovery invariants
        run: node --test tests/participant-identity-recovery.test.mjs tests/fight-history-recovery.test.mjs tests/full-history-coverage.test.mjs

      - name: Apply history identity and coverage schema
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve ambiguous participant identities
        run: node scripts/resolve-participant-identities.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Derive source-consistent exact-name history identities
        run: node scripts/derive-source-name-history-identities.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Recover every safe completed fighter-side history row
        run: node scripts/recover-global-fight-history.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Backfill newly resolved opponent identities
        run: node scripts/backfill-history-opponent-identities.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prove source-reported history materialization and freshness
        run: node scripts/audit-fighter-history-coverage.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Refresh fighter intelligence after history repair
        run: node scripts/apply-fighter-intel.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fight-history-recovery-audit
          path: |
            .cache/participant-identity/summary.json
            .cache/source-name-history/summary.json
            .cache/fight-history-recovery/summary.json
            .cache/fighter-history-coverage/summary.json
            .cache/fighter-history-coverage/opponent-backfill.json
            .cache/fighter-intel/summary.json
          if-no-files-found: ignore
          retention-days: 14
