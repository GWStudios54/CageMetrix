name: Recover global fight histories

on:
  workflow_run:
    workflows:
      - Sync MMA master database
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'scripts/recover-global-fight-history.mjs'
      - 'tests/fight-history-recovery.test.mjs'
      - '.github/workflows/fight-history-recovery.yml'
  workflow_dispatch:

concurrency:
  group: cagemetrix-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate history recovery invariants
        run: node --test tests/fight-history-recovery.test.mjs

      - name: Recover completed fighter-side history rows
        run: node scripts/recover-global-fight-history.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Refresh fighter intelligence after history repair
        run: node scripts/apply-fighter-intel.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fight-history-recovery-audit
          path: |
            .cache/fight-history-recovery/summary.json
            .cache/fighter-intel/summary.json
          if-no-files-found: ignore
          retention-days: 14
