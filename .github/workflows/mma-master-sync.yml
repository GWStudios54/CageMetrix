name: Sync MMA master database

on:
  schedule:
    - cron: '17 10 * * 1'
  pull_request:
    paths:
      - 'migrations/0012_mma_master_database.sql'
      - 'migrations/0013_ufc_history_scope.sql'
      - 'migrations/0014_warehouse_history_identity_guard.sql'
      - 'migrations/0015_ufc_warehouse_materialized_history.sql'
      - 'migrations/0016_precomputed_ufc_history_features.sql'
      - 'migrations/0023_scout_research_index.sql'
      - 'migrations/0024_scout_relationship_intelligence.sql'
      - 'migrations/0025_global_scouting.sql'
      - 'migrations/0026_global_scout_fight_history.sql'
      - 'migrations/0032_participant_identity_resolutions.sql'
      - 'migrations/0033_participant_identity_seed_facts.sql'
      - 'migrations/0034_source_name_history_coverage.sql'
      - 'migrations/0035_source_master_name_identities.sql'
      - 'scripts/import-mma-master.py'
      - 'scripts/build-global-scout-rating-v2.py'
      - 'scripts/prepare_d1_import.py'
      - 'scripts/apply_d1_chunks.py'
      - 'scripts/data/scout-promotions.json'
      - 'scripts/refresh-ufc-history.py'
      - 'scripts/refresh-ufc-history-small.py'
      - 'scripts/refresh-ufc-history.mjs'
      - 'scripts/canonicalize-ufc-history.py'
      - 'scripts/lib/warehouse-history.mjs'
      - 'scripts/resolve-participant-identities.mjs'
      - 'scripts/derive-source-name-history-identities.mjs'
      - 'scripts/recover-global-fight-history.mjs'
      - 'scripts/backfill-history-opponent-identities.mjs'
      - 'scripts/audit-fighter-history-coverage.mjs'
      - 'tests/warehouse-history.test.mjs'
      - 'tests/global-scout-rating.test.mjs'
      - 'tests/participant-identity-recovery.test.mjs'
      - 'tests/fight-history-recovery.test.mjs'
      - 'tests/full-history-coverage.test.mjs'
      - 'tests/test_prepare_d1_import.py'
      - 'tests/test_apply_d1_chunks.py'
      - 'tests/test_canonicalize_ufc_history.py'
      - '.github/workflows/mma-master-sync.yml'
      - '.github/workflows/fight-history-recovery.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/0012_mma_master_database.sql'
      - 'migrations/0013_ufc_history_scope.sql'
      - 'migrations/0014_warehouse_history_identity_guard.sql'
      - 'migrations/0015_ufc_warehouse_materialized_history.sql'
      - 'migrations/0016_precomputed_ufc_history_features.sql'
      - 'migrations/0023_scout_research_index.sql'
      - 'migrations/0024_scout_relationship_intelligence.sql'
      - 'migrations/0025_global_scouting.sql'
      - 'migrations/0026_global_scout_fight_history.sql'
      - 'migrations/0032_participant_identity_resolutions.sql'
      - 'migrations/0033_participant_identity_seed_facts.sql'
      - 'migrations/0034_source_name_history_coverage.sql'
      - 'migrations/0035_source_master_name_identities.sql'
      - 'scripts/import-mma-master.py'
      - 'scripts/build-global-scout-rating-v2.py'
      - 'scripts/prepare_d1_import.py'
      - 'scripts/apply_d1_chunks.py'
      - 'scripts/data/scout-promotions.json'
      - 'scripts/refresh-ufc-history.py'
      - 'scripts/refresh-ufc-history-small.py'
      - 'scripts/refresh-ufc-history.mjs'
      - 'scripts/canonicalize-ufc-history.py'
      - 'scripts/lib/warehouse-history.mjs'
      - 'scripts/resolve-participant-identities.mjs'
      - 'scripts/derive-source-name-history-identities.mjs'
      - 'scripts/recover-global-fight-history.mjs'
      - 'scripts/backfill-history-opponent-identities.mjs'
      - 'scripts/audit-fighter-history-coverage.mjs'
      - 'tests/warehouse-history.test.mjs'
      - 'tests/global-scout-rating.test.mjs'
      - 'tests/participant-identity-recovery.test.mjs'
      - 'tests/fight-history-recovery.test.mjs'
      - 'tests/full-history-coverage.test.mjs'
      - 'tests/test_prepare_d1_import.py'
      - 'tests/test_apply_d1_chunks.py'
      - 'tests/test_canonicalize_ufc_history.py'
      - '.github/workflows/mma-master-sync.yml'
      - '.github/workflows/fight-history-recovery.yml'
  workflow_dispatch:

concurrency:
  group: cagemetrix-production
  cancel-in-progress: false

jobs:
  prepare-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm ci

      - name: Validate global research pipeline
        run: |
          python -m py_compile scripts/refresh-ufc-history.py scripts/refresh-ufc-history-small.py scripts/canonicalize-ufc-history.py scripts/build-global-scout-rating-v2.py scripts/prepare_d1_import.py scripts/apply_d1_chunks.py tests/test_prepare_d1_import.py tests/test_apply_d1_chunks.py tests/test_canonicalize_ufc_history.py
          python tests/test_prepare_d1_import.py
          python tests/test_apply_d1_chunks.py
          python tests/test_canonicalize_ufc_history.py
          node --check scripts/refresh-ufc-history.mjs
          node --test tests/warehouse-history.test.mjs tests/global-scout-rating.test.mjs

      - name: Install data importer dependencies
        run: python -m pip install --disable-pip-version-check 'duckdb>=1.3,<2' 'kagglehub>=1.0,<2'

      - name: Download and prepare MMA master snapshot
        run: python scripts/import-mma-master.py

      - name: Build global Scout profiles and rating
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FILE="$(find .cache/mma-master/source -type f -name '*.duckdb' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$SOURCE_FILE"
          python scripts/build-global-scout-rating-v2.py --source "$SOURCE_FILE"

      - name: Validate prepared coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('.cache/mma-master/summary.json').read_text())
          scout = json.loads(Path('.cache/mma-master/scout-global-summary.json').read_text())
          assert summary['fighters'] >= 15000, summary
          assert summary['fights'] >= 120000, summary
          assert summary['participants'] == summary['fights'] * 2, summary
          assert summary['organizations'] >= 4000, summary
          technical_ratio = summary['technical_fights_matched'] / max(1, summary['technical_fights_source'])
          assert summary['technical_fights_matched'] >= 3500, summary
          assert technical_ratio >= 0.35, summary
          assert scout['profiles'] >= 15000, scout
          assert scout['profiles_with_history'] >= 12000, scout
          assert scout['ratings'] >= 12000, scout
          assert scout['materialized_fighter_fights'] >= 100000, scout
          assert scout['decisive_fights'] >= 50000, scout
          assert scout['promotion_registry_count'] >= 20, scout
          assert scout['elo_baseline']['fights'] >= 5000, scout
          assert scout['combined_model']['fights'] == scout['elo_baseline']['fights'], scout
          assert scout['combined_model']['log_loss'] < scout['elo_baseline']['log_loss'], scout
          assert abs(sum(scout['weights'].values()) - 1) < 1e-6, scout
          print(f"Verified technical overlay: {technical_ratio:.1%}")
          print('Prepared master snapshot:', json.dumps(summary, indent=2))
          print('Prepared global Scout model:', json.dumps(scout, indent=2))
          PY

      - name: Prepare D1-safe import
        shell: bash
        run: |
          set -euo pipefail
          D1_SQL_DIR=".cache/mma-master/d1-sql"
          rm -rf "$D1_SQL_DIR"
          python scripts/prepare_d1_import.py --input .cache/mma-master/sql --output "$D1_SQL_DIR"
          cat .cache/mma-master/d1-import-plan.json
          MAX_PREPARED="$(jq -r '.max_prepared_statement_bytes' .cache/mma-master/d1-import-plan.json)"
          if [ "$MAX_PREPARED" -gt 64000 ]; then
            echo "D1 preflight emitted an oversized statement: ${MAX_PREPARED} bytes" >&2; exit 1
          fi

      - name: Apply D1 schema
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import immutable snapshot into D1
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_ID="$(jq -r '.snapshot_id' .cache/mma-master/summary.json)"
          SOURCE_KEY="$(jq -r '.source_key' .cache/mma-master/summary.json)"
          STATUS="$(npx wrangler d1 execute cagemetrix --remote --command "SELECT status FROM mma_source_snapshots WHERE source_key='${SOURCE_KEY}' AND snapshot_id='${SNAPSHOT_ID}' LIMIT 1" --json | jq -r '.[0].results[0].status // ""')"
          GLOBAL_COUNT="$(npx wrangler d1 execute cagemetrix --remote --command "SELECT COUNT(*) AS n FROM scout_global_profiles WHERE source_key='${SOURCE_KEY}' AND snapshot_id='${SNAPSHOT_ID}'" --json 2>/dev/null | jq -r '.[0].results[0].n // 0' || echo 0)"
          EXPECTED_GLOBAL="$(jq -r '.profiles' .cache/mma-master/scout-global-summary.json)"
          if [ "$STATUS" = "complete" ] && [ "$GLOBAL_COUNT" -eq "$EXPECTED_GLOBAL" ]; then
            echo "Snapshot ${SNAPSHOT_ID} and global Scout layer are already complete; nothing to write."
          else
            python scripts/apply_d1_chunks.py \
              --directory .cache/mma-master/d1-sql \
              --database cagemetrix \
              --max-attempts 4 \
              --settle-seconds 1 \
              --backoff-seconds 3
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify remote master database
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute cagemetrix --remote --command "SELECT s.source_key,s.active_snapshot_id,x.status,x.fighter_count,x.fight_count,x.participant_count,x.technical_fight_count,x.organization_count,x.source_max_date FROM mma_source_registry s JOIN mma_source_snapshots x ON x.source_key=s.source_key AND x.snapshot_id=s.active_snapshot_id WHERE s.source_key='leandroiber_mmastats'" --json | tee .cache/mma-master/remote-verification.json

          EXPECTED_FIGHTS="$(jq -r '.fights' .cache/mma-master/summary.json)"
          EXPECTED_PARTICIPANTS="$(jq -r '.participants' .cache/mma-master/summary.json)"
          EXPECTED_PROFILES="$(jq -r '.profiles' .cache/mma-master/scout-global-summary.json)"
          EXPECTED_RATINGS="$(jq -r '.ratings' .cache/mma-master/scout-global-summary.json)"
          EXPECTED_GLOBAL_FIGHTS="$(jq -r '.materialized_fighter_fights' .cache/mma-master/scout-global-summary.json)"

          ACTIVE_FIGHTS="$(npx wrangler d1 execute cagemetrix --remote --command "SELECT COUNT(*) AS n FROM mma_active_fights" --json | jq -r '.[0].results[0].n')"
          ACTIVE_PARTICIPANTS="$(npx wrangler d1 execute cagemetrix --remote --command "SELECT COUNT(*) AS n FROM mma_active_fight_participants" --json | jq -r '.[0].results[0].n')"
          GLOBAL_PROFILES="$(npx wrangler d1 execute cagemetrix --remote --command "SELECT COUNT(*) AS n FROM scout_active_global_profiles" --json | jq -r '.[0].results[0].n')"
          GLOBAL_RATINGS="$(npx wrangler d1 execute cagemetrix --remote --command "SELECT COUNT(*) AS n FROM scout_active_global_ratings WHERE model_version='global-1.0.0'" --json | jq -r '.[0].results[0].n')"
          GLOBAL_FIGHTS="$(npx wrangler d1 execute cagemetrix --remote --command "SELECT COUNT(*) AS n FROM scout_active_global_fights" --json | jq -r '.[0].results[0].n')"

          if [ "$ACTIVE_FIGHTS" -ne "$EXPECTED_FIGHTS" ] || \
             [ "$ACTIVE_PARTICIPANTS" -ne "$EXPECTED_PARTICIPANTS" ] || \
             [ "$GLOBAL_PROFILES" -ne "$EXPECTED_PROFILES" ] || \
             [ "$GLOBAL_RATINGS" -ne "$EXPECTED_RATINGS" ] || \
             [ "$GLOBAL_FIGHTS" -ne "$EXPECTED_GLOBAL_FIGHTS" ]; then
            echo "Remote coverage mismatch:" >&2
            echo "  fights=$ACTIVE_FIGHTS expected=$EXPECTED_FIGHTS" >&2
            echo "  participants=$ACTIVE_PARTICIPANTS expected=$EXPECTED_PARTICIPANTS" >&2
            echo "  profiles=$GLOBAL_PROFILES expected=$EXPECTED_PROFILES" >&2
            echo "  ratings=$GLOBAL_RATINGS expected=$EXPECTED_RATINGS" >&2
            echo "  global_history=$GLOBAL_FIGHTS expected=$EXPECTED_GLOBAL_FIGHTS" >&2
            exit 1
          fi
          echo "Remote master exactly verified: $ACTIVE_FIGHTS fights / $ACTIVE_PARTICIPANTS participants / $GLOBAL_PROFILES profiles / $GLOBAL_RATINGS ratings / $GLOBAL_FIGHTS resolved fighter-fight rows."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Refresh UFC-linked warehouse history
        if: github.event_name != 'pull_request'
        run: python scripts/refresh-ufc-history-small.py --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Canonicalize UFC-linked warehouse history
        if: github.event_name != 'pull_request'
        run: python scripts/canonicalize-ufc-history.py --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload import audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mma-master-import-audit
          path: |
            .cache/mma-master/summary.json
            .cache/mma-master/scout-global-summary.json
            .cache/mma-master/d1-import-plan.json
            .cache/mma-master/d1-apply-audit.json
            .cache/mma-master/remote-verification.json
            .cache/mma-master/ufc-history-summary.json
            .cache/mma-master/ufc-history-canonical-summary.json
          if-no-files-found: ignore
          retention-days: 14
