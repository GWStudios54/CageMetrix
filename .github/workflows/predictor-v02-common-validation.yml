name: Archived Predictor 0.2.1 validation

on:
  workflow_dispatch:

concurrency:
  group: archived-predictor-v02-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Validate archived predictor code
        run: node --check scripts/validate-predictor-v02-common.mjs
      - name: Run archived common-holdout validation
        run: node scripts/validate-predictor-v02-common.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload archived validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archived-predictor-v02-1-common-validation
          path: .cache/predictor-v02-common-validation.json
          if-no-files-found: ignore
          retention-days: 30
