name: Archived warehouse prediction benchmark

on:
  workflow_dispatch:

concurrency:
  group: archived-warehouse-model-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Validate archived model code
        run: |
          node --check scripts/lib/warehouse-prior.mjs
          node --check scripts/lib/predictor_v02.mjs
          node --check scripts/benchmark-warehouse-models.mjs
      - name: Run archived benchmark
        run: node scripts/benchmark-warehouse-models.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload archived benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archived-warehouse-model-benchmark
          path: |
            .cache/warehouse-model-benchmark.json
            .cache/predictor-v02-fit.json
          if-no-files-found: ignore
          retention-days: 30
