name: Sync fighter professional contact intelligence

on:
  schedule:
    - cron: '50 10 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'migrations/0042_fighter_professional_contact_intelligence.sql'
      - 'scripts/sync-fighter-contacts.mjs'
      - 'scripts/lib/fighter-contact-sources.mjs'
      - 'tests/fighter-contact-intel.test.mjs'
      - 'src/recruiting.ts'
      - 'src/talent-network.ts'
      - 'src/fighter-intel.ts'
      - '.github/workflows/fighter-contact-sync.yml'
      - '.github/workflows/fighter-intel.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/0042_fighter_professional_contact_intelligence.sql'
      - 'scripts/sync-fighter-contacts.mjs'
      - 'scripts/lib/fighter-contact-sources.mjs'
      - 'tests/fighter-contact-intel.test.mjs'
      - 'src/recruiting.ts'
      - 'src/talent-network.ts'
      - 'src/fighter-intel.ts'
      - '.github/workflows/fighter-contact-sync.yml'
      - '.github/workflows/fighter-intel.yml'

concurrency:
  group: mmascouts-fighter-contact-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate fighter professional contact evidence
        run: node --test tests/fighter-contact-intel.test.mjs tests/recruiting.test.mjs tests/talent-network.test.mjs
      - name: Probe official fighter contacts without writes
        if: github.event_name == 'pull_request'
        run: node scripts/sync-fighter-contacts.mjs --dry-run
      - name: Apply fighter contact schema
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync fighter-specific professional contacts
        if: github.event_name != 'pull_request'
        run: npm run fighter:contacts:sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighter-contact-audit
          path: .cache/fighter-contacts/
          if-no-files-found: ignore
          retention-days: 14
