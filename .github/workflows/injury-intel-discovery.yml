name: Discover public MMA injury/availability intelligence

on:
  schedule:
    - cron: '05 12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/0047_injury_availability_intelligence.sql'
      - 'scripts/discover-injury-intel.mjs'
      - 'scripts/lib/injury-intel-discovery.mjs'
      - '.github/workflows/injury-intel-discovery.yml'

# Injury discovery is idempotent and independent from Worker releases. Keep it out of the production
# deploy lane so a UI deploy cannot discard a valid source-discovery run from the same commit (same
# reasoning as contract/camp/anti-doping discovery).
concurrency:
  group: mmascouts-injury-intel
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply injury/availability intelligence schema
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Discover source-backed injury/withdrawal leads
        run: node scripts/discover-injury-intel.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injury-intel-discovery
          path: .cache/injury-intel/
          if-no-files-found: ignore
          retention-days: 14
