name: Review Freedom 250 headshots
on:
  push:
    branches:
      - feature/headshot-freedom250
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install review dependency
        run: python -m pip install --quiet pillow
      - name: Build contact sheet
        shell: bash
        run: |
          mkdir -p diagnostics/freedom250/images
          python - <<'PY'
          import urllib.parse, urllib.request
          from PIL import Image, ImageDraw, ImageOps
          items = {
            'alex-pereira': 'UFC Freedom 250 Ceremonial Weigh In (9748623) (cropped).jpg',
            'ciryl-gane': 'UFC Freedom 250 Ceremonial Weigh In (9748626)(cropped).jpg',
            'sean-omalley': 'UFC Freedom 250 on the South Lawn of the White House in Washington, D.C. on June 14, 2026 - 29(cropped).png',
            'aiemann-zahabi': 'UFC Freedom 250 Press Conference (9747954)(cropped).jpg',
            'josh-hokit': 'UFC Freedom 250 Press Conference (9747953) (cropped).jpg',
            'derrick-lewis': 'UFC Freedom 250 Press Conference (9747952) (cropped).jpg',
            'diego-lopes': 'UFC Freedom 250 Press Conference (9747949).jpg',
            'mauricio-ruffy': 'UFC Freedom 250 Press Conference (9747950).jpg',
          }
          tiles=[]
          for slug, filename in items.items():
            url='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+urllib.parse.quote(filename, safe="(),'_.")+'?width=900'
            path=f'diagnostics/freedom250/images/{slug}.img'
            try:
              req=urllib.request.Request(url, headers={'User-Agent':'CageMetrix/1.0 photo review'})
              data=urllib.request.urlopen(req, timeout=30).read()
              open(path,'wb').write(data)
              im=Image.open(path).convert('RGB')
              im=ImageOps.fit(im,(300,360),method=Image.Resampling.LANCZOS,centering=(0.5,0.30))
              canvas=Image.new('RGB',(320,410),'white')
              canvas.paste(im,(10,10))
              ImageDraw.Draw(canvas).text((10,378),slug,fill='black')
            except Exception as e:
              canvas=Image.new('RGB',(320,410),'white')
              d=ImageDraw.Draw(canvas)
              d.text((10,20),slug,fill='black')
              d.text((10,50),f'FAILED: {e}'[:48],fill='black')
            tiles.append(canvas)
          cols=4
          rows=(len(tiles)+cols-1)//cols
          sheet=Image.new('RGB',(cols*320,rows*410),(230,230,230))
          for i,t in enumerate(tiles): sheet.paste(t,((i%cols)*320,(i//cols)*410))
          sheet.save('diagnostics/freedom250/contact-sheet.jpg',quality=90)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: freedom250-photo-review
          path: diagnostics/freedom250/
          retention-days: 7
