name: Discover public MMA anti-doping intelligence

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/0045_antidoping_intelligence.sql'
      - 'scripts/discover-antidoping-intel.mjs'
      - 'scripts/lib/antidoping-intel-discovery.mjs'
      - '.github/workflows/antidoping-intel-discovery.yml'

# Anti-doping discovery is idempotent and independent from Worker releases. Keep it out of the
# production deploy lane so a UI deploy cannot discard a valid source-discovery run from the same
# commit (same reasoning as contract/camp/injury discovery).
concurrency:
  group: mmascouts-antidoping-intel
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply anti-doping intelligence schema
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Discover source-backed anti-doping leads
        run: node scripts/discover-antidoping-intel.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antidoping-intel-discovery
          path: .cache/antidoping-intel/
          if-no-files-found: ignore
          retention-days: 14
