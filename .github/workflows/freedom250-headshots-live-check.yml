name: Find Sean OMalley production slug
on:
  push:
    branches:
      - diagnostic/freedom250-headshots-live
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production sitemap and rankings
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://cagemetrix.aarin54.workers.dev'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'CageMetrix diagnostic','Accept':'application/json,text/xml,text/plain'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.read().decode('utf-8','replace')
          for path in ['/sitemap.xml','/api/rankings']:
              try:
                  status,body=get(path)
                  print('\nPATH',path,'STATUS',status,'LEN',len(body))
                  low=body.lower()
                  for term in ['sean','omalley','o-malley','o%27malley']:
                      idx=low.find(term)
                      if idx>=0:
                          print('MATCH',term,body[max(0,idx-300):idx+500].replace('\n',' '))
              except Exception as e:
                  print('ERROR',path,repr(e))
          PY
