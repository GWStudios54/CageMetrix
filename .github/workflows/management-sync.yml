name: Sync MMA management data

on:
  schedule:
    - cron: '45 10 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - 'migrations/0037_contract_representation_intelligence.sql'
      - 'scripts/sync-management.mjs'
      - 'scripts/lib/management-sources.mjs'
      - 'scripts/data/management-name-aliases.json'
      - 'src/management-about.ts'
      - 'src/talent-admin.ts'
      - 'tests/management-sources.test.mjs'
      - 'tests/contract-intelligence.test.mjs'
      - 'package.json'
      - '.github/workflows/management-sync.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/0037_contract_representation_intelligence.sql'
      - 'scripts/sync-management.mjs'
      - 'scripts/lib/management-sources.mjs'
      - 'scripts/data/management-name-aliases.json'
      - 'src/management-about.ts'
      - 'src/talent-admin.ts'
      - 'tests/management-sources.test.mjs'
      - 'tests/contract-intelligence.test.mjs'
      - 'package.json'
      - '.github/workflows/management-sync.yml'

# Keep management refreshes from overlapping each other, but do not put this
# independent/idempotent sync in the generic Worker release lane. GitHub only
# keeps one pending run per concurrency group; sharing cagemetrix-production
# caused a valid management push run to be discarded when deploy + contract
# discovery were queued from the same commit.
concurrency:
  group: mmascouts-management-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate management and contract evidence parsers
        run: node --test tests/management-sources.test.mjs tests/contract-intelligence.test.mjs
      - name: Probe official management rosters
        if: github.event_name == 'pull_request'
        run: node scripts/sync-management.mjs --dry-run
      - name: Apply talent and evidence schema
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync official management rosters and evidence
        if: github.event_name != 'pull_request'
        run: npm run management:sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Refresh crawlable agency sitemap
        if: github.event_name != 'pull_request'
        run: |
          node scripts/generate-sitemap.mjs --remote
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-sync-audit
          path: .cache/management/
          if-no-files-found: ignore
          retention-days: 14
