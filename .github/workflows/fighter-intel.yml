name: Refresh fighter intelligence

on:
  schedule:
    - cron: '20 11 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh UFC scouting data
      - Sync MMA management data
    types:
      - completed
  pull_request:
    paths:
      - 'migrations/0030_fighter_intelligence.sql'
      - 'src/fighter-intel.ts'
      - 'src/entry.ts'
      - 'src/recruiting.ts'
      - 'tests/recruiting.test.mjs'
      - 'scripts/sync-fighter-intel.mjs'
      - 'scripts/lib/fighter-intel-policy.mjs'
      - 'tests/fighter-intel.test.mjs'
      - 'package.json'
      - '.github/workflows/fighter-intel.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/0030_fighter_intelligence.sql'
      - 'src/fighter-intel.ts'
      - 'src/entry.ts'
      - 'scripts/sync-fighter-intel.mjs'
      - 'scripts/lib/fighter-intel-policy.mjs'
      - 'tests/fighter-intel.test.mjs'
      - 'package.json'
      - '.github/workflows/fighter-intel.yml'

concurrency:
  group: mmascouts-fighter-intel
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate fighter intelligence contracts
        run: |
          node --test tests/fighter-intel.test.mjs
          node scripts/sync-fighter-intel.mjs --dry-run
      - name: Apply intelligence schema
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Refresh every fighter intelligence file
        if: github.event_name != 'pull_request'
        run: npm run intel:sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighter-intel-audit
          path: .cache/fighter-intel/
          if-no-files-found: ignore
          retention-days: 14
