name: Sync promotion location intelligence

on:
  schedule:
    - cron: '5 11 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'migrations/0039_location_intelligence.sql'
      - 'scripts/sync-promotion-location.mjs'
      - 'scripts/lib/promotion-location-sources.mjs'
      - 'tests/promotion-location-intel.test.mjs'
      - '.github/workflows/promotion-location-sync.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/0039_location_intelligence.sql'
      - 'scripts/sync-promotion-location.mjs'
      - 'scripts/lib/promotion-location-sources.mjs'
      - 'tests/promotion-location-intel.test.mjs'
      - '.github/workflows/promotion-location-sync.yml'

concurrency:
  group: mmascouts-promotion-location
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate location evidence parser
        run: node --test tests/promotion-location-intel.test.mjs tests/fighter-intel.test.mjs
      - name: Probe official PFL fighter profiles
        if: github.event_name == 'pull_request'
        run: node scripts/sync-promotion-location.mjs --dry-run
      - name: Apply location intelligence schema
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync official promotion location evidence
        if: github.event_name != 'pull_request'
        run: npm run locations:sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-location-audit
          path: .cache/promotion-location/
          if-no-files-found: ignore
          retention-days: 14
