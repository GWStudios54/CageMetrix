name: Validate Predictor 0.1 production
on:
  push:
    branches:
      - model/predictor-v01-production
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate code and tests
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Prepare current data without touching D1
        run: node scripts/refresh-data.mjs --dry-run
      - name: Generate Predictor 0.1 forecasts without touching D1
        run: node scripts/sync-forecasts.mjs --dry-run
      - name: Verify model handoff SQL
        run: |
          grep -q "CageMetrix Elo Baseline" .cache/forecasts/forecasts.sql
          grep -q "Frozen Predictor 0.1" .cache/forecasts/forecasts.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictor-v01-production-audit
          path: |
            .cache/refresh/summary.json
            .cache/forecasts/summary.json
            .cache/forecasts/forecasts.sql
          retention-days: 7
