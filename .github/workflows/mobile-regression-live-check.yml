name: Verify deployed mobile regressions
on:
  push:
    branches:
      - diagnostic/mobile-regression-live-check
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check live mobile UI and model consistency
        shell: bash
        run: |
          mkdir -p diagnostics
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const base='https://cagemetrix.aarin54.workers.dev';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:3,isMobile:true,hasTouch:true});
          const page=await context.newPage();
          await page.goto(`${base}/?v=${Date.now()}`,{waitUntil:'domcontentloaded'});

          const topbar=page.locator('.topbar');
          const brand=topbar.locator('.brand');
          const nav=topbar.locator('nav');
          await topbar.waitFor();
          const [topbarBox,brandBox,navBox,navMetrics]=await Promise.all([
            topbar.boundingBox(),brand.boundingBox(),nav.boundingBox(),
            nav.evaluate(el=>({scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,scrollHeight:el.scrollHeight,clientHeight:el.clientHeight}))
          ]);
          assert.ok(topbarBox&&topbarBox.x>=0&&topbarBox.x+topbarBox.width<=413,`header overflowed mobile viewport: ${JSON.stringify(topbarBox)}`);
          assert.ok(brandBox&&navBox&&navBox.y>=brandBox.y+brandBox.height,`navigation did not move below the brand row: brand=${JSON.stringify(brandBox)} nav=${JSON.stringify(navBox)}`);
          assert.ok(navMetrics.scrollWidth<=navMetrics.clientWidth+1,`navigation still requires horizontal scrolling: ${JSON.stringify(navMetrics)}`);
          assert.ok(navMetrics.scrollHeight<=navMetrics.clientHeight+1,`navigation links wrapped vertically: ${JSON.stringify(navMetrics)}`);
          const navLinks=await nav.locator('a').evaluateAll(links=>links.map(el=>({text:el.textContent?.trim(),whiteSpace:getComputedStyle(el).whiteSpace,rect:el.getBoundingClientRect().toJSON()})));
          assert.ok(navLinks.length>=3,'expected primary navigation links');
          assert.ok(navLinks.every(link=>link.whiteSpace==='nowrap'),`mobile nav link wrapping is enabled: ${JSON.stringify(navLinks)}`);

          const spotlight=page.locator('.event-spotlight');
          await spotlight.waitFor();
          const box=await spotlight.boundingBox();
          assert.ok(box&&box.x>=0&&box.x+box.width<=413,`spotlight overflowed mobile viewport: ${JSON.stringify(box)}`);
          assert.equal(await spotlight.locator('.status-dot').count(),0,'legacy status dot is still rendered');
          const cta=spotlight.locator('.button.primary');
          const color=await cta.evaluate(el=>getComputedStyle(el).color);
          assert.equal(color,'rgb(255, 255, 255)',`CTA text is not white: ${color}`);
          await page.screenshot({path:'diagnostics/home-mobile.png',fullPage:true});

          const eventUrl=`${base}/events/ufc-fight-night-september-05-2026?v=${Date.now()}`;
          await page.goto(eventUrl,{waitUntil:'domcontentloaded'});
          const eventCard=page.locator('.event-card-seo');
          await eventCard.waitFor({timeout:15000});
          await page.waitForTimeout(1200);
          const eventBox=await eventCard.boundingBox();
          assert.ok(eventBox&&eventBox.x>=0&&eventBox.x+eventBox.width<=413,`event card overflowed mobile viewport: ${JSON.stringify(eventBox)}`);
          const bouts=eventCard.locator('.forecast-bout');
          assert.ok(await bouts.count()>=5,'expected multiple restored forecast rows');
          const first=bouts.first();
          const firstText=await first.innerText();
          assert.match(firstText,/Dan Hooker/i,'first fight is missing Dan Hooker');
          assert.match(firstText,/Salahdine Parnasse/i,'first fight is missing Salahdine Parnasse');
          assert.match(firstText,/63\.5%/,'Hooker probability missing from restored row');
          assert.match(firstText,/36\.5%/,'Parnasse probability missing from restored row');
          assert.equal(await first.locator('.forecast-fighter').count(),2,'restored row does not have two fighter sides');
          assert.equal(await first.locator('.portrait').count(),2,'restored row does not have two fighter portraits/placeholders');
          const portraits=await first.locator('.portrait').evaluateAll(nodes=>nodes.map(el=>({display:getComputedStyle(el).display,width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height,hasPhoto:Boolean(el.querySelector('.portrait-photo'))})));
          assert.ok(portraits.every(p=>p.display!=='none'&&p.width>=35&&p.height>=40),`portraits/placeholders are not visible: ${JSON.stringify(portraits)}`);
          const bar=first.locator('.probability-bar');
          assert.equal(await bar.count(),1,'probability bar missing');
          const barBox=await bar.boundingBox();
          assert.ok(barBox&&barBox.width>200&&barBox.height>=6,'probability bar is not visibly rendered');
          const barPct=await bar.locator('span').evaluate((el)=>parseFloat(getComputedStyle(el).width)/parseFloat(getComputedStyle(el.parentElement).width)*100);
          assert.ok(Math.abs(barPct-63.4723)<1.0,`Hooker probability bar width is wrong: ${barPct}`);
          assert.equal(await page.locator('.event-grid').count(),0,'old giant event grid is still rendered');
          assert.equal(await first.locator('.button.secondary').count(),0,'old broken fight CTA is still rendered');
          assert.ok((await page.locator('link[rel="canonical"]').getAttribute('href'))?.includes('/events/ufc-fight-night-september-05-2026'),'canonical event URL missing');
          assert.match(await page.title(),/UFC Paris Predictions/i,'SEO event title missing');
          assert.ok(await page.locator('script[type="application/ld+json"]').count()>=2,'event structured data missing');
          await page.screenshot({path:'diagnostics/event-mobile.png',fullPage:true});

          await page.goto(`${base}/fights/1?v=${Date.now()}`,{waitUntil:'domcontentloaded'});
          await page.locator('#fan-prediction .fans-side h3').first().waitFor({timeout:15000});
          const [fight,fans]=await page.evaluate(async()=>Promise.all([
            fetch('/api/fights/1',{cache:'no-store'}).then(r=>r.json()),
            fetch('/api/fights/1/fans',{cache:'no-store'}).then(r=>r.json())
          ]));
          assert.equal(fight.prediction.model_version,fans.model.model_version,'fight and fan panels use different model versions');
          assert.ok(Math.abs(fight.prediction.fighter_a_probability-fans.model.fighter_a_probability)<1e-12,'fighter A probability differs between panels');
          assert.ok(Math.abs(fight.prediction.fighter_b_probability-fans.model.fighter_b_probability)<1e-12,'fighter B probability differs between panels');
          const version=fight.prediction.model_version;
          assert.ok((await page.locator('.locked-note').innerText()).includes(`Predictor ${version}`),'main probability label is stale');
          assert.ok((await page.locator('#fan-prediction .fans-side h3').first().innerText()).includes(version),'fan comparison label is stale');
          const edgeLabels=await page.locator('#fight-drivers .driver-heading span').allInnerTexts();
          assert.ok(edgeLabels.every(text=>!/\bedge$/i.test(text)),`literal edge language remains: ${edgeLabels.join(' | ')}`);
          const driverText=await page.locator('#fight-drivers').innerText();
          assert.ok(driverText.includes('UFC sample & uncertainty adjustment'),'UFC sample/uncertainty label was not applied');
          assert.ok(driverText.includes('not a claim that the favored fighter has more UFC experience'),'experience disclaimer is missing');
          await page.screenshot({path:'diagnostics/fight-mobile.png',fullPage:true});
          console.log(JSON.stringify({version,a:fight.prediction.fighter_a_probability,b:fight.prediction.fighter_b_probability,ctaColor:color,eventBox,barPct,portraits,topbarBox,brandBox,navBox,navMetrics,navLinks,edgeLabels},null,2));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-regression-live-check
          path: diagnostics/
          retention-days: 7
