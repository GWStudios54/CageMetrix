name: Discover amateur MMA records from Wikipedia

on:
  schedule:
    # Weekly, not daily: amateur record is a static biographical fact that essentially never
    # changes once turned pro, and Wikipedia is looked up per already-known fighter rather than
    # scanned as a news feed -- a daily cron would just be needless load on Wikimedia's API for no
    # new information.
    - cron: '0 13 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/0049_amateur_record_wikipedia_discovery.sql'
      - 'scripts/discover-amateur-record-intel.mjs'
      - 'scripts/lib/amateur-record-intel-discovery.mjs'
      - '.github/workflows/amateur-record-intel-discovery.yml'

# Independent from Worker releases, same reasoning as contract/camp/coach/injury/anti-doping discovery.
concurrency:
  group: mmascouts-amateur-record-intel
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply amateur-record discovery schema
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check a batch of fighters against Wikipedia
        run: node scripts/discover-amateur-record-intel.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amateur-record-intel-discovery
          path: .cache/amateur-record-intel/
          if-no-files-found: ignore
          retention-days: 14
