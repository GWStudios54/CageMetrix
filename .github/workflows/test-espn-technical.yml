name: Test cross-promotion technical candidate

on:
  push:
    branches:
      - external-technical-espn
    paths:
      - 'migrations/0023_espn_mma_technical.sql'
      - 'scripts/lib/espn-mma.mjs'
      - 'scripts/lib/recent-source.mjs'
      - 'scripts/sync-espn-mma-technical.mjs'
      - 'scripts/validate-espn-mma-live.mjs'
      - 'scripts/validate-ufcalendar-external-live.mjs'
      - 'scripts/validate-ufcstats-legacy-live.mjs'
      - 'scripts/diagnose-espn-mma-stat-sources.mjs'
      - 'scripts/probe-espn-mma-capabilities.mjs'
      - 'scripts/audit-existing-external-technical.mjs'
      - 'tests/espn-mma.test.mjs'
      - '.github/workflows/test-espn-technical.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Chromium for UFCStats browser validation
        run: npx playwright install --with-deps chromium
      - name: Validate candidate syntax and unit tests
        run: |
          node --check scripts/lib/espn-mma.mjs
          node --check scripts/sync-espn-mma-technical.mjs
          node --check scripts/validate-espn-mma-live.mjs
          node --check scripts/validate-ufcalendar-external-live.mjs
          node --check scripts/validate-ufcstats-legacy-live.mjs
          node --check scripts/diagnose-espn-mma-stat-sources.mjs
          node --check scripts/probe-espn-mma-capabilities.mjs
          node --check scripts/audit-existing-external-technical.mjs
          npm test
      - name: Validate migration on local D1
        run: npx wrangler d1 migrations apply cagemetrix --local
      - name: Audit existing non-UFC technical coverage in production warehouse
        run: node scripts/audit-existing-external-technical.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Measure UFCStats legacy coverage against production pre-UFC fights
        continue-on-error: true
        run: node scripts/validate-ufcstats-legacy-live.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Validate public UFCalendar multi-promotion technical pages
        continue-on-error: true
        run: node scripts/validate-ufcalendar-external-live.mjs
      - name: Compare ESPN UFC and Bellator stat capabilities
        run: node scripts/probe-espn-mma-capabilities.mjs
      - name: Probe ESPN MMA alternate statistics surfaces
        run: node scripts/diagnose-espn-mma-stat-sources.mjs
      - name: Read-only live ESPN coverage test against production target identities
        run: node scripts/validate-espn-mma-live.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-technical-validation
          path: |
            .cache/external-technical-audit/report.json
            .cache/ufcstats-legacy-validation/report.json
            .cache/ufcalendar-external-validation/report.json
            .cache/espn-mma-validation/report.json
            .cache/espn-mma-validation/source-diagnostics.json
            .cache/espn-mma-validation/capabilities.json
          if-no-files-found: ignore
          retention-days: 14
