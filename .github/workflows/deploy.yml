name: Deploy CageMetrix

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'migrations/0012_mma_master_database.sql'
      - 'migrations/0013_ufc_history_scope.sql'
      - 'migrations/0014_warehouse_history_identity_guard.sql'
      - 'migrations/0015_ufc_warehouse_materialized_history.sql'
      - 'migrations/0016_precomputed_ufc_history_features.sql'
      - 'scripts/import-mma-master.py'
      - 'scripts/refresh-ufc-history.py'
      - 'scripts/refresh-ufc-history.mjs'
      - 'scripts/lib/warehouse-history.mjs'
      - 'tests/warehouse-history.test.mjs'
      - '.github/workflows/mma-master-sync.yml'
  workflow_dispatch:

concurrency:
  group: cagemetrix-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate changes
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-refresh-audit
          path: |
            .cache/refresh/summary.json
            .cache/refresh/before-refresh.sql
            .cache/forecasts/summary.json
          retention-days: 7
