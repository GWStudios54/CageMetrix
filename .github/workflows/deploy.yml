name: Deploy MMA Scouts

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'migrations/0012_mma_master_database.sql'
      - 'migrations/0013_ufc_history_scope.sql'
      - 'migrations/0014_warehouse_history_identity_guard.sql'
      - 'migrations/0015_ufc_warehouse_materialized_history.sql'
      - 'migrations/0016_precomputed_ufc_history_features.sql'
      - 'migrations/0023_scout_research_index.sql'
      - 'migrations/0024_scout_relationship_intelligence.sql'
      - 'migrations/0025_global_scouting.sql'
      - 'migrations/0026_global_scout_fight_history.sql'
      - 'scripts/import-mma-master.py'
      - 'scripts/build-global-scout-rating-v2.py'
      - 'scripts/data/scout-promotions.json'
      - 'scripts/refresh-ufc-history.py'
      - 'scripts/refresh-ufc-history-small.py'
      - 'scripts/refresh-ufc-history.mjs'
      - 'scripts/refresh-data.mjs'
      - 'scripts/sync-forecasts.mjs'
      - 'scripts/lib/dataset.mjs'
      - 'scripts/lib/forecast.mjs'
      - 'scripts/lib/warehouse-history.mjs'
      - 'scripts/lib/warehouse-prior.mjs'
      - 'scripts/lib/predictor_v02.mjs'
      - 'scripts/benchmark-warehouse-models.mjs'
      - 'scripts/validate-predictor-v02-common.mjs'
      - 'tests/warehouse-history.test.mjs'
      - 'tests/global-scout-rating.test.mjs'
      - '.github/workflows/mma-master-sync.yml'
      - '.github/workflows/warehouse-model-benchmark.yml'
      - '.github/workflows/predictor-v02-common-validation.yml'
      - '.github/workflows/model-promotion.yml'
  workflow_dispatch:

concurrency:
  group: cagemetrix-production
  cancel-in-progress: false

jobs:
  deploy:
    # Model promotions run their own ordered D1 -> forecast -> Worker release.
    # The marker prevents the generic deploy from cutting over the Worker first.
    if: ${{ !contains(github.event.head_commit.message || '', '[model-promotion]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate changes
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Apply pending D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            set +e
            output="$(npm run db:migrate:remote 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$output" | grep -q 'Currently processing a long-running import'; then
              echo "::warning::D1 is busy with another import; retrying migration apply in 15 seconds (attempt $attempt/8)."
              sleep 15
              continue
            fi
            exit "$status"
          done
          echo "::error::D1 remained busy after 8 migration attempts."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
