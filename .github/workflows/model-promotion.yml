# Promotion attempt 4: D1 verification steps receive the same Cloudflare credentials as refresh/deploy.
name: Promote CMR 0.3.1 and Predictor 0.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/model-promotion.yml'
  workflow_dispatch:

concurrency:
  group: cagemetrix-production
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate production code
        run: |
          npm run typecheck
          npm test
          npm run build
          node --check scripts/refresh-data.mjs
          node --check scripts/sync-forecasts.mjs
          node --check scripts/lib/forecast.mjs
          node --check scripts/lib/predictor_v02.mjs

      - name: Write CMR 0.3.1 ratings to D1
        run: npm run data:refresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify CMR 0.3.1 in D1
        run: |
          mkdir -p .cache/promotion
          npx wrangler d1 execute cagemetrix --remote --command "SELECT mv.version,COUNT(*) AS ratings,SUM(CASE WHEN rh.components_json LIKE '%\"warehouse_prior\"%' THEN 1 ELSE 0 END) AS warehouse_prior_ratings,MAX(rh.as_of_date) AS source_max_date FROM ratings_history rh JOIN model_versions mv ON mv.id=rh.model_version_id WHERE mv.name='CageMetrix Opponent-Adjusted Rating' AND mv.version='0.3.1' GROUP BY mv.version" --json > .cache/promotion/cmr-verification.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('.cache/promotion/cmr-verification.json','utf8'));const r=(Array.isArray(j)?j:[j]).flatMap(x=>x.results||[])[0];if(!r||Number(r.ratings)<2600||Number(r.warehouse_prior_ratings)<1000)throw new Error('CMR 0.3.1 D1 verification failed: '+JSON.stringify(r));console.log(r)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate and lock Predictor 0.2 forecasts
        run: npm run forecasts:sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Predictor 0.2 in D1
        run: |
          npx wrangler d1 execute cagemetrix --remote --command "SELECT mv.version,COUNT(*) AS predictions,SUM(CASE WHEN b.status='scheduled' THEN 1 ELSE 0 END) AS scheduled_predictions,MIN(p.locked_at) AS first_locked_at,MAX(p.locked_at) AS latest_locked_at FROM predictions p JOIN model_versions mv ON mv.id=p.model_version_id JOIN bouts b ON b.id=p.bout_id WHERE mv.name='CageMetrix Win Probability' AND mv.version='0.2.0' GROUP BY mv.version" --json > .cache/promotion/predictor-verification.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('.cache/promotion/predictor-verification.json','utf8'));const r=(Array.isArray(j)?j:[j]).flatMap(x=>x.results||[])[0];if(!r||Number(r.predictions)<1||Number(r.scheduled_predictions)<1)throw new Error('Predictor 0.2 D1 verification failed: '+JSON.stringify(r));console.log(r)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy CMR 0.3.1 Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test production cutover
        run: |
          mkdir -p .cache/promotion
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://cagemetrix.com/api/health > .cache/promotion/health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 'https://cagemetrix.com/api/rankings?limit=1' > .cache/promotion/rankings.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://cagemetrix.com/api/forecasts > .cache/promotion/forecasts.json
          node - <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('.cache/promotion/health.json','utf8'));
          const rankings=JSON.parse(fs.readFileSync('.cache/promotion/rankings.json','utf8'));
          const forecasts=JSON.parse(fs.readFileSync('.cache/promotion/forecasts.json','utf8'));
          if(!health.ok||health.model_version!=='0.3.1'||health.data?.model_version!=='0.3.1') throw new Error('Health did not cut over to CMR 0.3.1: '+JSON.stringify(health));
          if(rankings.meta?.model_version!=='0.3.1'||!(rankings.data?.length>0)) throw new Error('Rankings did not cut over to CMR 0.3.1');
          if(forecasts.meta?.model_version!=='0.2.0'||!(forecasts.data?.length>0)) throw new Error('Forecasts did not cut over to Predictor 0.2');
          console.log({cmr:health.model_version,predictor:forecasts.meta.model_version,forecast_rows:forecasts.data.length});
          NODE

      - name: Upload promotion audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-promotion-audit
          path: |
            .cache/refresh/summary.json
            .cache/refresh/before-refresh.sql
            .cache/forecasts/summary.json
            .cache/forecasts/wrangler-output.log
            .cache/promotion/cmr-verification.json
            .cache/promotion/predictor-verification.json
            .cache/promotion/health.json
            .cache/promotion/rankings.json
            .cache/promotion/forecasts.json
          retention-days: 30
