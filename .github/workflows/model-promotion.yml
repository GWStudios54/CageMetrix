name: Promote CMR 0.3.2 and Predictor 0.2.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/model-promotion.yml']
  workflow_dispatch:

concurrency:
  group: cagemetrix-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for fight-page regression
        run: npx playwright install --with-deps chromium
      - name: Validate code and fresh local D1 migrations
        run: |
          npm run typecheck
          npm test
          npm run db:migrate:local
          npm run test:fights:e2e
          npm run build
          node --check scripts/refresh-data.mjs
          node --check scripts/sync-forecasts.mjs
          node --check scripts/benchmark-warehouse-models.mjs
          node --check scripts/validate-predictor-v02-common.mjs
          node --check scripts/verify-model-promotion.mjs
      - name: Capture immutable production baselines
        run: |
          mkdir -p .cache/promotion
          npx wrangler d1 execute cagemetrix --remote --command "SELECT (SELECT COUNT(*) FROM ratings_history rh JOIN model_versions mv ON mv.id=rh.model_version_id WHERE mv.name='CageMetrix Opponent-Adjusted Rating' AND mv.version='0.3.1') AS cmr_0_3_1_ratings,(SELECT COUNT(*) FROM predictions p JOIN model_versions mv ON mv.id=p.model_version_id WHERE mv.name='CageMetrix Win Probability' AND mv.version='0.2.0') AS predictor_0_2_0_predictions,(SELECT COUNT(*) FROM ufc_warehouse_career_rows) AS raw_warehouse_rows" --json > .cache/promotion/before-model-counts.json
      - name: Refit and independently validate corrected common holdout
        run: |
          node scripts/benchmark-warehouse-models.mjs
          node scripts/validate-predictor-v02-common.mjs
          node scripts/verify-model-promotion.mjs > .cache/promotion/benchmark-gate.json
      - name: Write canonical-history CMR 0.3.2 ratings to D1
        run: npm run data:refresh
      - name: Verify CMR 0.3.2 snapshot and preserved history in D1
        run: |
          npx wrangler d1 execute cagemetrix --remote --command "SELECT (SELECT COUNT(*) FROM ratings_history rh JOIN model_versions mv ON mv.id=rh.model_version_id WHERE mv.name='CageMetrix Opponent-Adjusted Rating' AND mv.version='0.3.1') AS cmr_0_3_1_ratings,(SELECT COUNT(*) FROM ratings_history rh JOIN model_versions mv ON mv.id=rh.model_version_id WHERE mv.name='CageMetrix Opponent-Adjusted Rating' AND mv.version='0.3.2') AS cmr_0_3_2_ratings,(SELECT COUNT(*) FROM ratings_history rh JOIN model_versions mv ON mv.id=rh.model_version_id WHERE mv.name='CageMetrix Opponent-Adjusted Rating' AND mv.version='0.3.2' AND rh.components_json LIKE '%\"warehouse_prior\"%') AS warehouse_prior_ratings,(SELECT source_key FROM rating_runs rr JOIN model_versions mv ON mv.id=rr.model_version_id WHERE mv.name='CageMetrix Opponent-Adjusted Rating' AND mv.version='0.3.2' ORDER BY rr.id DESC LIMIT 1) AS rating_run_source_key,(SELECT notes FROM rating_runs rr JOIN model_versions mv ON mv.id=rr.model_version_id WHERE mv.name='CageMetrix Opponent-Adjusted Rating' AND mv.version='0.3.2' ORDER BY rr.id DESC LIMIT 1) AS rating_run_notes,(SELECT json_extract(parameters_json,'$.warehouse_fingerprint') FROM model_versions WHERE name='CageMetrix Opponent-Adjusted Rating' AND version='0.3.2') AS model_warehouse_fingerprint,(SELECT json_extract(value,'$.warehouse_fingerprint') FROM bootstrap_state WHERE key='data:latest') AS state_warehouse_fingerprint,(SELECT json_extract(value,'$.model_version') FROM bootstrap_state WHERE key='data:latest') AS state_model_version,(SELECT COUNT(*) FROM ufc_warehouse_career_rows) AS raw_warehouse_rows" --json > .cache/promotion/cmr-verification.json
          node scripts/verify-production-model-state.mjs cmr
      - name: Generate and lock Predictor 0.2.1 forecasts
        run: npm run forecasts:sync
      - name: Verify Predictor 0.2.1 and retained 0.2.0 snapshots in D1
        run: |
          npx wrangler d1 execute cagemetrix --remote --command "SELECT (SELECT COUNT(*) FROM predictions p JOIN model_versions mv ON mv.id=p.model_version_id WHERE mv.name='CageMetrix Win Probability' AND mv.version='0.2.0') AS predictor_0_2_0_predictions,(SELECT COUNT(*) FROM predictions p JOIN model_versions mv ON mv.id=p.model_version_id WHERE mv.name='CageMetrix Win Probability' AND mv.version='0.2.1') AS predictor_0_2_1_predictions,(SELECT COUNT(*) FROM predictions p JOIN model_versions mv ON mv.id=p.model_version_id JOIN bouts b ON b.id=p.bout_id WHERE mv.name='CageMetrix Win Probability' AND mv.version='0.2.1' AND b.status='scheduled') AS scheduled_predictions,(SELECT COUNT(*) FROM predictions p JOIN model_versions mv ON mv.id=p.model_version_id WHERE mv.name='CageMetrix Win Probability' AND mv.version='0.2.1' AND json_extract(p.input_snapshot_json,'$.model_version')='0.2.1' AND json_extract(p.input_snapshot_json,'$.cmr_version')='0.3.2') AS verified_new_snapshots" --json > .cache/promotion/predictor-verification.json
          node scripts/verify-production-model-state.mjs predictor
      - name: Deploy CMR 0.3.2 Worker
        run: npm run deploy
      - name: Smoke-test production cutover and canonical profiles
        run: |
          base='https://cagemetrix.aarin54.workers.dev'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/api/health" > .cache/promotion/health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/api/rankings?limit=1" > .cache/promotion/rankings.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/api/forecasts" > .cache/promotion/forecasts.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/api/fighters/salahdine-parnasse" > .cache/promotion/parnasse.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/api/fighters/arman-tsarukyan" > .cache/promotion/tsarukyan.json
          node scripts/verify-production-model-state.mjs smoke
          custom_code=$(curl --silent --show-error --location --user-agent 'Mozilla/5.0 CageMetrix-Production-Smoke/1.0' --output .cache/promotion/custom-domain-health.body --dump-header .cache/promotion/custom-domain-health.headers --write-out '%{http_code}' https://cagemetrix.com/api/health || true)
          if [ "$custom_code" = '200' ]; then
            echo 'Custom domain health endpoint returned 200.'
          elif [ "$custom_code" = '403' ] && grep -qi '^cf-mitigated: challenge' .cache/promotion/custom-domain-health.headers; then
            echo '::warning::Cloudflare challenged the GitHub Actions request; workers.dev verified the deployment.'
          else
            echo "Unexpected custom-domain health response: $custom_code"
            cat .cache/promotion/custom-domain-health.headers || true
            exit 1
          fi
      - name: Upload promotion audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-promotion-audit
          path: |
            .cache/warehouse-model-benchmark.json
            .cache/predictor-v02-fit.json
            .cache/predictor-v02-common-validation.json
            .cache/refresh/summary.json
            .cache/refresh/before-refresh.sql
            .cache/forecasts/summary.json
            .cache/forecasts/wrangler-output.log
            .cache/promotion/*.json
            .cache/promotion/custom-domain-health.headers
            .cache/promotion/custom-domain-health.body
          retention-days: 30
