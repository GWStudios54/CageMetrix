name: Sync fighter availability intelligence

on:
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'migrations/0040_availability_intelligence.sql'
      - 'scripts/sync-availability.mjs'
      - 'scripts/lib/availability-sources.mjs'
      - 'tests/availability-intel.test.mjs'
      - 'src/recruiting.ts'
      - 'src/talent-network.ts'
      - 'src/fighter-intel.ts'
      - 'scripts/sync-fighter-intel.mjs'
      - '.github/workflows/availability-sync.yml'
      - '.github/workflows/fighter-intel.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/0040_availability_intelligence.sql'
      - 'scripts/sync-availability.mjs'
      - 'scripts/lib/availability-sources.mjs'
      - 'tests/availability-intel.test.mjs'
      - 'src/recruiting.ts'
      - 'src/talent-network.ts'
      - 'src/fighter-intel.ts'
      - 'scripts/sync-fighter-intel.mjs'
      - '.github/workflows/availability-sync.yml'
      - '.github/workflows/fighter-intel.yml'

concurrency:
  group: mmascouts-availability-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate availability evidence
        run: node --test tests/availability-intel.test.mjs tests/fighter-intel.test.mjs tests/recruiting.test.mjs tests/talent-network.test.mjs
      - name: Probe official agency availability without writes
        if: github.event_name == 'pull_request'
        run: node scripts/sync-availability.mjs --dry-run
      - name: Apply availability intelligence schema
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply cagemetrix --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync official fighter availability evidence
        if: github.event_name != 'pull_request'
        run: npm run availability:sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: availability-intel-audit
          path: .cache/availability/
          if-no-files-found: ignore
          retention-days: 14
