<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CageMetrix Fantasy</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#10151c;color:#f5f3eb}*{box-sizing:border-box}body{margin:0}header{padding:22px max(20px,calc((100vw - 960px)/2));border-bottom:1px solid #33404b;background:#151d26}a{color:#e6b765}main{max-width:960px;margin:auto;padding:28px 20px 90px}h1{font-size:clamp(2.4rem,6vw,4rem);margin:4px 0}h2{margin-top:36px}.eyebrow{color:#e6b765;text-transform:uppercase;letter-spacing:.16em;font-weight:700;font-size:.78rem}.muted{color:#aab7c0}.card{background:#1b2630;border:1px solid #384650;border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.grid .card{margin:0}button,input,select{font:inherit}button{background:#e6b765;color:#17191b;border:0;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer}button:disabled{opacity:.45;cursor:default}input,select{background:#101820;color:white;border:1px solid #65717a;border-radius:8px;padding:12px;width:100%;margin:5px 0 15px}label{display:block;font-weight:650}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #36434c;padding:12px 0}.row:last-child{border:0}.pill{font-size:.76rem;color:#f3d595;border:1px solid #8b703f;padding:3px 7px;border-radius:99px}.notice{padding:12px;border-radius:8px;background:#263443}.error{background:#522c30}small{color:#aab7c0}#pool{max-height:560px;overflow:auto}
</style></head><body><header><strong>CAGEMETRIX</strong> <span class="muted">/ FANTASY</span></header><main><p class="eyebrow">Build your fight stable</p><h1>Fantasy MMA, with a real draft.</h1><p class="muted">Draft exclusive fighters. Start solo against bot managers. Premier and Challengers have separate fighter pools.</p><div id="message" aria-live="polite"></div><div id="content"></div></main><script type="module">
const root=document.querySelector('#content'),message=document.querySelector('#message');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
async function api(path,options){const response=await fetch('/api/fantasy'+path,{credentials:'same-origin',...options});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
function alertText(s,bad=false){message.innerHTML=`<p class="notice ${bad?'error':''}">${esc(s)}</p>`}
async function home(){root.innerHTML=`<div class="grid"><div class="card"><h2>Premier</h2><p>UFC fighters with recent verified bouts. Round stats drive fight scoring.</p></div><div class="card"><h2>Challengers</h2><p>Regional pros with identified profiles and fight histories. Separate competition and draft pool.</p></div></div><section class="card"><h2>Create a solo league</h2><form id="create"><label>League name<input name="name" maxlength="60" required value="My Fight League"></label><label>Competition<select name="tier"><option value="premier">Premier</option><option value="challengers">Challengers</option></select></label><label>Managers (including you)<select name="seats"><option>2</option><option>4</option><option>6</option><option>8</option></select></label><button>Create and fill with bots</button></form></section><h2>Your leagues</h2><div id="leagues">Loading…</div>`;
 document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.currentTarget));b.seats=Number(b.seats);try{const result=await api('/leagues',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});location.href=result.url}catch(err){alertText(err.message,true)}};
 try{const data=await api('/leagues');document.querySelector('#leagues').innerHTML=data.leagues.length?data.leagues.map(l=>`<div class="row"><div><a href="/fantasy/${esc(l.id)}">${esc(l.name)}</a><br><small>${esc(l.tier)} · ${l.seats} managers · ${esc(l.status)}</small></div></div>`).join(''):'<p class="muted">No leagues yet. Create one above.</p>'}catch(err){document.querySelector('#leagues').innerHTML='<p>Sign in on <a href="https://mmascouts.com/community">MMA Scouts</a> to create a league. This early version uses your MMA Scouts account.</p>'}}
async function draft(id){try{const [s,p]=await Promise.all([api('/leagues/'+id),api('/leagues/'+id+'/pool')]);let current=s.turn===null?'Draft complete':s.managers[s.turn].account_id===null?'Bot selecting…':'Your pick';
 root.innerHTML=`<p><a href="/fantasy">← Your leagues</a></p><h2>${esc(s.league.name)} <span class="pill">${esc(s.league.tier)}</span></h2><p class="notice">${current} · ${s.picks.length}/${s.league.seats*4} picks · 4 rounds, snake draft</p><div class="card"><h2>Standings</h2>${s.standings.map((r,i)=>`<div class="row"><span>${i+1}. ${esc(r.name)}</span><strong>${r.points} pts</strong></div>`).join('')}<small>Points update as verified fight results appear. Each tier has its own scoring.</small></div><div class="grid"><section class="card"><h2>Draft board</h2>${s.managers.map(m=>`<h3>${m.account_id===null?'🤖 '+esc(m.bot_name):'You'} <small>Seat ${m.draft_position+1}</small></h3>${s.picks.filter(x=>x.manager_id===m.id).map(x=>`<div class="row">${esc(x.fighter_name)} <small>#${x.pick_number+1}</small></div>`).join('')||'<p class="muted">No picks yet</p>'}`).join('')}</section><section class="card"><h2>Available fighters</h2><label>Search<input id="search" placeholder="Fighter name"></label><div id="pool"></div></section></div>`;
 const canPick=s.turn!==null&&s.managers[s.turn].account_id!==null;const list=document.querySelector('#pool');function render(q=''){list.innerHTML=p.fighters.filter(f=>f.fighter_name.toLowerCase().includes(q.toLowerCase())).slice(0,60).map(f=>`<div class="row"><div><strong>${esc(f.fighter_name)}</strong><br><small>${esc(f.division||'Division unknown')}</small></div><button data-key="${esc(f.fighter_key)}" ${canPick?'':'disabled'}>Draft</button></div>`).join('')||'<p class="muted">No matching eligible fighters.</p>'}render();document.querySelector('#search').oninput=e=>render(e.target.value);
 list.onclick=async e=>{const key=e.target.closest('button')?.dataset.key;if(!key)return;e.target.disabled=true;try{await api('/leagues/'+id+'/picks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({fighter_key:key})});await draft(id)}catch(err){alertText(err.message,true);e.target.disabled=false}};
 }catch(err){alertText(err.message,true)}}
const id=location.pathname.split('/')[2];if(id)draft(id);else home();
</script></body></html>
